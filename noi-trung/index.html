<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nói Trung — Luyện nói tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F3EC;--ink:#17161B;--mute:#8C877F;--line:#E8E1D4;--card:#fff;--red:#D9442B;--redS:#FBE7E1;--jade:#12876A;--jadeS:#DDF1EA;--gold:#B8913A;--goldS:#F5ECD6;--t1:#E5484D;--t2:#F59F00;--t3:#2F9E44;--t4:#1C7ED6;--t0:#8C877F;--redG:linear-gradient(180deg,#EF6A47,#C9341D)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E9E2D6;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding:18px 18px 112px}
.hz{font-family:'Noto Serif SC','Songti SC','STSong',serif}
.hv{font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--gold)}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 30px -10px rgba(40,25,10,.16)}
.outline{background:#fff;border:1px solid var(--line);border-radius:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--redG);color:#fff;box-shadow:0 10px 20px -8px rgba(217,68,43,.55)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.icon{width:20px;height:20px;flex:none}
.circ{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);flex:none}
h1{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:0}
h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.small{font-size:12px}.tiny{font-size:11px}
.seg{display:flex;background:#EDE6DA;border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 0;border-radius:12px;font-size:13px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 4px 12px -4px rgba(0,0,0,.12)}
.badge{font-size:10px;font-weight:700;color:#fff;background:#D7CEBF;border-radius:999px;padding:1px 6px}
.seg button.on .badge{background:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:none;cursor:pointer;font-weight:600;padding:7px 13px;font-size:12px}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mute)}
.tab.on{color:var(--red);font-weight:700}
.tab .mic{width:52px;height:52px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -6px rgba(0,0,0,.4);margin-top:-18px}
.tab.on .mic{background:var(--redG);box-shadow:0 8px 16px -6px rgba(217,68,43,.6)}
/* home */
.hero{border-radius:28px;padding:20px;color:#fff;background:linear-gradient(135deg,#2A2630,#3B2125);position:relative;overflow:hidden;box-shadow:0 18px 32px -14px rgba(59,33,37,.6)}
.hero .wm{position:absolute;right:-18px;top:-46px;font-size:170px;opacity:.06;font-weight:700;pointer-events:none}
.bar{height:6px;border-radius:3px;background:#EAE3D6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.stage{display:flex;align-items:center;gap:14px;padding:13px;border-radius:22px;background:#fff;border:1px solid var(--line);width:100%;text-align:left}
.stage .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700;flex:none}
.tile{border-radius:22px;padding:14px;min-height:92px;text-align:left}
/* list */
.list{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .hzl{font-size:21px;font-weight:700;letter-spacing:.04em;line-height:1.25}
.pyl{font-size:12px;font-weight:600}
/* practice */
.ruby{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px}
.ch{display:flex;flex-direction:column;align-items:center;min-width:.9em;cursor:pointer;border-radius:10px;padding:2px 2px 4px;position:relative}
.ch i{font-style:normal;font-weight:600;line-height:1.3;white-space:nowrap}
.ch b{font-weight:700;line-height:1.15}
.ch.p{cursor:default}
.ch .sc{position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px}
.ch.cur{background:var(--redS)}
.hidepy .ch i{visibility:hidden}
.hidehz .ch b{color:transparent!important;background:repeating-linear-gradient(90deg,#EFE8DC 0 100%);border-radius:8px}
.note{display:flex;gap:10px;padding:11px 12px;border-radius:16px;background:var(--goldS);color:#6B5420;font-size:12.5px;line-height:1.45;text-align:left}
.rec{width:86px;height:86px;border-radius:50%;background:var(--redG);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(217,68,43,.10),0 0 0 24px rgba(217,68,43,.05),0 12px 22px -8px rgba(217,68,43,.6);transition:transform .15s}
.rec:active{transform:scale(.95)}
.rec.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,68,43,.35),0 12px 22px -8px rgba(217,68,43,.6)}100%{box-shadow:0 0 0 26px rgba(217,68,43,0),0 12px 22px -8px rgba(217,68,43,.6)}}
.meter{display:flex;align-items:center;gap:3px;height:34px;justify-content:center}
.meter i{width:3px;border-radius:2px;background:var(--red);height:4px;transition:height .08s}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;width:100%;text-align:left}
.sent.cur{background:var(--redS);outline:1.5px solid rgba(217,68,43,.4)}
.sent .num{width:22px;height:22px;border-radius:50%;background:#EDE6DA;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:4px;color:var(--mute)}
.sent.done .num{background:var(--jadeS);color:var(--jade)}
.sent .hzs{font-size:19px;line-height:1.55;letter-spacing:.04em}
.sent.speaking .hzs{color:var(--red)}
.metric .bar{height:6px}
.ctile{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;border-radius:16px;background:#fff;border:1px solid var(--line);min-width:0}
.ctile.bad{background:var(--redS);border:1.5px solid var(--red)}
.ctiles{display:flex;gap:6px;flex-wrap:wrap}
.ctiles .ctile{flex:1 0 56px;max-width:80px}
canvas{width:100%;display:block}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:50;max-width:min(400px,90vw);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(23,22,27,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(440px,100%);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--mute)}
.field input,.field textarea,.field select{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;outline:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--red)}
.warn{background:var(--redS);color:#8E2A18;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.ok{background:var(--jadeS);color:#0C5E49;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lock{opacity:.6}
.spacer{height:14px}

.stat{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800;background:#fff;border:1px solid var(--line)}
.stat.fl{color:var(--gold);background:var(--goldS);border:0}.stat.xp{color:var(--t4)}.stat.lv{color:var(--jade)}
.masc{width:62px;height:62px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;animation:bob 2.6s ease-in-out infinite;box-shadow:0 6px 0 var(--line)}
.masc.sm{width:40px;height:40px;font-size:24px;box-shadow:none;animation:none}.masc.big{width:120px;height:120px;font-size:72px;animation:bob 1.4s ease-in-out infinite}
.bubble{background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:11px 14px;font-size:13.5px;line-height:1.45;flex:1}
.lbar{height:14px;border-radius:7px;background:#E5DCCB;overflow:hidden}.lbar>i{display:block;height:100%;border-radius:7px;background:linear-gradient(180deg,#2BB08D,#12876A);transition:width .55s cubic-bezier(.3,1.4,.5,1)}
.qchip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--paper);color:var(--mute)}.qchip.on{background:var(--jadeS);color:var(--jade)}
.uhead{display:flex;align-items:center;gap:12px;color:#fff;border-radius:20px;padding:14px 16px;margin-top:10px;position:sticky;top:8px;z-index:5}
.uhead .ui{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 6px}
.pwrap{display:flex;flex-direction:column;align-items:center;position:relative}
.pnode{width:72px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--d);transition:transform .08s,box-shadow .08s}
.pnode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.pnode.lock{background:#DDD5C7;box-shadow:0 7px 0 #C5BBAA;color:#A69C8B}
.pnode.done{background:#E7B93E;box-shadow:0 7px 0 #B98E22}
.pnode.cur{animation:floaty 1.6s ease-in-out infinite;outline:5px solid rgba(217,68,43,.18);outline-offset:5px}
.start{position:absolute;top:-34px;background:#fff;border:2px solid var(--line);color:var(--red);font-weight:800;font-size:12px;padding:5px 10px;border-radius:10px;letter-spacing:.05em;animation:floaty 1.6s ease-in-out infinite;z-index:2;white-space:nowrap}
.pwrap:has(.start){margin-top:30px}
.crowns{font-size:11px;color:#E0A91F;letter-spacing:1px;height:16px;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:9px}.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;width:100%;transition:transform .06s}
.opt:active{transform:translateY(3px);border-bottom-width:2px}
.opt .k{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mute);flex:none}
.opt.good{border-color:var(--jade);background:var(--jadeS);animation:pop .3s}.opt.badc{border-color:var(--red);background:var(--redS);animation:shake .35s}
.opt.sel{border-color:var(--t4);background:#E7F1FC}.opt.gone{opacity:.25;pointer-events:none;border-color:var(--jade)}
.mcell{justify-content:center;text-align:center;min-height:62px}
.fb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;z-index:30;display:flex;flex-direction:column;gap:12px;animation:slideUp .28s cubic-bezier(.2,1.2,.4,1)}
.fb.ok{background:#D5F2E6;color:#0C5E49}.fb.no{background:#FCE1DA;color:#8E2A18}.fb.neutral{background:rgba(247,243,236,.96);border-top:1px solid var(--line)}
.btn3{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:16px;font-weight:800;font-size:16px;color:#fff;letter-spacing:.02em;transition:transform .06s,box-shadow .06s}
.btn3.g{background:#18A07E;box-shadow:0 5px 0 #0B6650}.btn3.r{background:var(--red);box-shadow:0 5px 0 #A93220}.btn3.w{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn3:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}.btn3:disabled{background:#DDD5C7;box-shadow:0 5px 0 #C5BBAA;color:#A69C8B}
.au{width:52px;height:52px;border-radius:16px;background:var(--t4);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #155FA3;flex:none;transition:transform .06s,box-shadow .06s}
.au.big{width:104px;height:104px;border-radius:30px;box-shadow:0 8px 0 #155FA3}.au:active{transform:translateY(4px);box-shadow:0 1px 0 #155FA3}
.chip{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;padding:9px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;animation:pop .2s}
.chip.used{opacity:.2;pointer-events:none}
.ansline{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.link{font-size:13px;color:var(--mute);text-decoration:underline;align-self:center;padding:6px}
.sec{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mute);margin-top:6px}
.bub{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:18px;max-width:86%}
.bub.ai{background:#fff;border:1px solid var(--line);border-top-left-radius:5px;align-self:flex-start}.bub.me{background:var(--ink);color:#fff;border-top-right-radius:5px}
.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes slideUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fcard{position:relative;height:96px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:#fff;perspective:600px;transition:transform .25s}
.fcard .ff,.fcard .fb2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center;border-radius:14px;backface-visibility:hidden;transition:transform .3s}
.fcard .ff{font-size:26px;background:linear-gradient(135deg,#F5ECD6,#EDE0BD)}.fcard .fb2{transform:rotateY(180deg);background:#fff}
.fcard.up .ff{transform:rotateY(180deg)}.fcard.up .fb2{transform:rotateY(360deg)}.fcard.ok{border-color:var(--jade);background:var(--jadeS)}.fcard.ok .fb2{background:var(--jadeS)}
.arena{position:relative;height:340px;border-radius:20px;background:linear-gradient(180deg,#E7F1FC,#F7F3EC);overflow:hidden;border:1px solid var(--line)}
.arena:after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--red);opacity:.4}
.ri{position:absolute;display:flex;flex-direction:column;align-items:center;padding:6px 10px;background:#fff;border-radius:12px;box-shadow:0 6px 14px -6px rgba(0,0,0,.25);line-height:1.15}
.wt{width:44px;height:48px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;background:#fff}
.wt.g{background:#18A07E;border-color:#18A07E;color:#fff}.wt.y{background:#E7B93E;border-color:#E7B93E;color:#fff}.wt.x{background:#9A9388;border-color:#9A9388;color:#fff}
.bcell{height:84px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;text-align:center}
.bcell.ok{background:var(--jadeS);border-color:var(--jade)}.bcell.no{background:var(--redS);border-color:var(--red);animation:shake .35s}.bcell:active{transform:translateY(3px)}
.bubble2{height:104px;border-radius:50%;border:3px solid var(--b);background:#fff;color:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:floaty 2.4s ease-in-out infinite;box-shadow:0 8px 18px -8px var(--b)}
.bubble2.good{background:var(--b);color:#fff;animation:pop .3s}.bubble2.badc{opacity:.35;animation:shake .35s}
.track{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 26px 8px 8px;display:flex;flex-direction:column;gap:6px}
.lane{position:relative;height:30px;border-bottom:2px dashed #E2D9C8}.car{position:absolute;top:0;font-size:24px;transform:translateX(-6%);transition:left .6s cubic-bezier(.3,1.3,.5,1)}.flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:22px}
</style>
</head>

{id:'c14',t:'cum',hsk:1,topic:'Lịch sự',hz:'请坐',py:'qǐng zuò',tn:[3,4],hv:'Thỉnh toạ',vn:'Mời ngồi'},

/* ---------- tiện ích ---------- */
function byId(id){return allItems().find(x=>x.id===id)}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}return a}
const TM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function stripTone(s){let o='';for(const ch of s){let f=ch;const lc=ch.toLowerCase();for(const b in TM){if(TM[b].indexOf(lc)>=0){f=ch===lc?b:b.toUpperCase();break}}o+=f}return o}
function setTone(syl,t){const b=stripTone(syl);if(!t)return b;const low=b.toLowerCase();let idx=low.indexOf('a');if(idx<0)idx=low.indexOf('e');if(idx<0)idx=low.indexOf('ou');if(idx<0){for(let i=low.length-1;i>=0;i--)if('iouü'.includes(low[i])){idx=i;break}}if(idx<0)return b;const m=TM[low[idx]][t-1];return b.slice(0,idx)+(b[idx]===low[idx]?m:m.toUpperCase())+b.slice(idx+1)}
function toneVariants(it){const sy=it.py.split(' ');const out=[it.py];let g=0;while(out.length<4&&g++<60){const i=Math.random()*sy.length|0;const cur=parsePinyinTone(sy[i]);let t=1+(Math.random()*4|0);if(t===cur)continue;const v=sy.map((s,k)=>k===i?setTone(s,t):s).join(' ');if(!out.includes(v))out.push(v)}return out}
function beep(f,d,when,type,v){try{const c=AC(),o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.14,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
function sfx(k){if(S.mute)return;if(k==='ok'){beep(660,.12);beep(990,.2,.09)}else if(k==='bad'){beep(220,.18,0,'triangle');beep(165,.25,.12,'triangle')}else if(k==='win'){[523,659,784,1047].forEach((f,i)=>beep(f,.22,i*.11))}else if(k==='tap'){beep(520,.05,0,'sine',.06)}}
function confetti(){try{const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99';document.body.appendChild(cv);const W=cv.width=innerWidth,H=cv.height=innerHeight,g=cv.getContext('2d');const cols=['#D9442B','#12876A','#B8913A','#1C7ED6','#F59F00','#7C5CD6'];const ps=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:5+Math.random()*7,c:cols[Math.random()*6|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));const t0=Date.now();(function tick(){const el=Date.now()-t0;g.clearRect(0,0,W,H);for(const p of ps){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-el/2600);g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);g.restore()}if(el<2600)requestAnimationFrame(tick);else cv.remove()})()}catch(e){}}
const QUESTS=[['xp',30,'Kiếm 30 XP','⚡'],['les',2,'Xong 2 bài học','📘'],['spk',5,'Nói đạt ≥80 điểm 5 câu','🎙️']];
function Q(){const d=today();if(!S.q||S.q.d!==d)S.q={d,xp:0,les:0,spk:0,done:{}};return S.q}
function checkQuests(){const q=Q();for(const [k,goal,label] of QUESTS){if(!q.done[k]&&q[k]>=goal){q.done[k]=1;S.xp=(S.xp||0)+5;S.xpLog[today()]=(S.xpLog[today()]||0)+5;setTimeout(()=>{toast('🎁 Xong nhiệm vụ: '+label+' (+5 XP)',3200);sfx('win')},700)}}}
function addXP(n){S.xp=(S.xp||0)+n;S.xpLog=S.xpLog||{};const d=today();S.xpLog[d]=(S.xpLog[d]||0)+n;if(!S.days.includes(d))S.days.push(d);Q().xp+=n;checkQuests();persist()}
function onScored(res){if(!res||res.err)return;const ts=S.ts||(S.ts={});res.chars.forEach(c=>{if(c.tone&&c.tn){const k=c.tone.eff;ts[k]=ts[k]||{n:0,s:0};ts[k].n++;ts[k].s+=c.tone.score}});if(res.overall>=80)Q().spk++;if(view==='lesson'&&L){const e=L.q[L.i];if(e&&e.type==='speak')e.score=res.overall}else if(res.overall>=60)addXP(2);checkQuests();persist()}
function level(){return Math.floor(Math.sqrt((S.xp||0)/25))+1}

/* ---------- lộ trình ---------- */
function nodesOf(u){const n=[];for(let i=0;i<u.ids.length;i+=4)n.push({id:u.id+'-'+(i/4),unit:u,ids:u.ids.slice(i,i+4),kind:'lesson'});n.push({id:u.id+'-R',unit:u,ids:u.ids,kind:'review'});return n}
function allNodes(){return UNITS.flatMap(nodesOf)}
function nodeState(list,i){if((N()[list[i].id]||0)>0)return'done';if(S.unlockAll||i===0||(N()[list[i-1].id]||0)>0)return'open';return'lock'}
function distract(it,n,key){const L0=hanOnly(it.hz).length;const pool=sh(allItems().filter(x=>x.t!=='doan'&&x.id!==it.id&&x[key]&&x[key]!==it[key]&&Math.abs(hanOnly(x.hz).length-L0)<=3));const out=[],seen=new Set([it[key]]);for(const x of pool){if(!seen.has(x[key])){seen.add(x[key]);out.push(x)}if(out.length>=n)break}return out}
function mkEx(type,it){const e={type,it};if(type==='mcVN'||type==='listenVN')e.opts=sh([it].concat(distract(it,3,'vn')));if(type==='mcHZ'||type==='listen')e.opts=sh([it].concat(distract(it,3,'hz')));if(type==='tone')e.opts=sh(toneVariants(it));if(type==='order'){e.chips=sh(hanOnly(it.hz).map(c=>({c})));e.picked=[]}return e}
function mkMatch(its){its=sh(its).slice(0,4);return{type:'match',its,left:sh(its.map(x=>x.id)),right:sh(its.map(x=>x.id)),done:{},sel:null,flash:null}}
function hardType(it){const n=hanOnly(it.hz).length;return n>=4&&n<=9?'order':n<4?'tone':'listen'}
function buildQueue(its,intro,kind){const q=[];if(kind==='review'){sh(its).slice(0,8).forEach((it,i)=>q.push(mkEx(['listen','mcHZ','mcVN'][i%3]==='mcVN'?hardType(it):['listen','mcHZ'][i%2],it)));if(its.length>=3)q.splice(4,0,mkMatch(its))}
 else{its.forEach((it,i)=>{if(intro)q.push(mkEx('intro',it));q.push(mkEx(i%2?'mcHZ':'mcVN',it))});if(its.length>=3)q.push(mkMatch(its));its.forEach((it,i)=>q.push(mkEx(i%2?hardType(it):'listen',it)))}
 if(!micBlocked)sh(its).slice(0,2).forEach(it=>q.push(mkEx('speak',it)));return q}
let L=null,D=null;
function startL(title,q,node){stopAll();L={title,q,node:node||null,i:0,ok:0,bad:0,combo:0,maxCombo:0,fb:null,picked:null,t0:Date.now(),prev:0};view='lesson';enterEx();render();window.scrollTo(0,0)}
function startNode(id){const list=allNodes();const i=list.findIndex(n=>n.id===id);if(i<0)return;if(nodeState(list,i)==='lock'){toast('Hoàn thành bài trước để mở khoá nhé!');return}const n=list[i];const its=n.ids.map(byId).filter(Boolean);const lv=N()[n.id]||0;startL(n.kind==='review'?'Ôn tập: '+n.unit.title:n.unit.title,buildQueue(its,n.kind==='lesson'&&lv===0,n.kind),n)}
function enterEx(){const e=L.q[L.i];P.result=null;if(P.url){try{URL.revokeObjectURL(P.url)}catch(_){}P.url=null}if(!e)return;if(e.type==='speak')P.u=Object.assign({},e.it,{uid:e.it.gen?'gen':e.it.id});const say=e.type==='ear'?e.it.c:(e.it&&['intro','mcVN','listen','listenVN','tone','speak'].includes(e.type)?e.it.hz:null);if(say)setTimeout(()=>{if(view==='lesson'&&L&&L.q[L.i]===e)speak(say,S.rate)},250)}
function corrIdx(e){if(e.type==='tone')return e.opts.indexOf(e.it.py);if(e.type==='ear')return e.it.t-1;return e.opts.indexOf(e.it)}
function answer(ok){const e=L.q[L.i];L.fb={ok};if(ok){L.ok++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);sfx('ok')}else{L.bad++;L.combo=0;sfx('bad');if(L.q.length<40){const c=Object.assign({},e);if(c.opts)c.opts=sh(c.opts);if(c.chips){c.chips=sh(c.chips);c.picked=[]}delete c.score;L.q.push(c)}}if(['mcHZ','ear','order'].includes(e.type))speak(e.type==='ear'?e.it.c:e.it.hz,S.rate);render()}
function pickOpt(i){if(!L||L.fb)return;L.picked=i;answer(i===corrIdx(L.q[L.i]))}
function nextEx(){L.prev=Math.round(L.i/L.q.length*100);L.fb=null;L.picked=null;L.i++;if(L.i>=L.q.length){finishL();return}enterEx();render();window.scrollTo(0,0)}
function finishL(){const tot=L.ok+L.bad;const acc=tot?Math.round(L.ok/tot*100):100;let xp=10+(L.bad===0?5:0)+(L.maxCombo>=5?3:0);if(L.node){N()[L.node.id]=Math.min(3,(N()[L.node.id]||0)+1)}Q().les++;S.lessons=(S.lessons||0)+1;if(L.bad===0)S.perfect=(S.perfect||0)+1;addXP(xp);const sec=Math.round((Date.now()-L.t0)/1000);D={title:L.bad===0?'Hoàn hảo!':'Hoàn thành bài học!',sub:L.title,tiles:[['+'+xp,'XP','var(--gold)'],[acc+'%','chính xác','var(--jade)'],[Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),'thời gian','var(--t4)']]};L=null;view='done';render();confetti();sfx('win');window.scrollTo(0,0)}
function chipTap(i){const e=L.q[L.i];if(L.fb||e.picked.includes(i))return;e.picked.push(i);sfx('tap');render()}
function unchip(k){const e=L.q[L.i];if(L.fb)return;e.picked.splice(k,1);render()}
function checkOrder(){const e=L.q[L.i];answer(e.picked.map(i=>e.chips[i].c).join('')===hanOnly(e.it.hz).join(''))}
function matchTap(side,id){const e=L.q[L.i];if(e.done[id]||L.fb)return;if(side==='l'){e.sel=id;const it=byId(id);if(it)speak(it.hz,S.rate);render();return}if(!e.sel)return;if(e.sel===id){e.done[id]=1;e.sel=null;if(Object.keys(e.done).length===e.its.length){L.fb={ok:true};L.ok++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo)}sfx('ok')}else{e.flash=id;sfx('bad');setTimeout(()=>{e.flash=null;if(view==='lesson')render()},450)}render()}
function spkDone(){const e=L.q[L.i];if((e.score||0)>=60){L.ok++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo)}else L.bad++;nextEx()}

const DG='零一二三四五六七八九',DP=['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ'];
function numZh(n){const hz=[],py=[];const th=n/1000|0,h=(n/100|0)%10,t=(n/10|0)%10,o=n%10;let zero=false;if(th){hz.push(th===2?'两':DG[th],'千');py.push(th===1?'yì':th===2?'liǎng':DP[th],'qiān')}if(h){hz.push(DG[h],'百');py.push(h===1?'yì':DP[h],'bǎi')}else if(th&&(t||o))zero=true;if(t){if(zero){hz.push('零');py.push('líng');zero=false}if(!(t===1&&n<20)){hz.push(DG[t]);py.push(DP[t])}hz.push('十');py.push('shí')}else if((th||h)&&o)zero=true;if(o){if(zero){hz.push('零');py.push('líng')}hz.push(DG[o]);py.push(DP[o])}return{hz:hz.join(''),py:py.join(' ')}}
function genNum(kind){let hz,py,vn;const r=(a,b)=>a+(Math.random()*(b-a+1)|0);if(kind===2){const H=r(1,12),M=[0,5,10,15,20,30,40,45,50][r(0,8)];const h=H===2?{hz:'两',py:'liǎng'}:numZh(H);hz=h.hz+'点';py=h.py+' diǎn';if(M===30){hz+='半';py+=' bàn'}else if(M){const m=numZh(M);hz+=(M<10?'零':'')+m.hz+'分';py+=(M<10?' líng ':' ')+m.py+' fēn'}vn=H+':'+String(M).padStart(2,'0')}
 else{const n=[r(11,99),r(100,999),r(1000,9999),r(1,10)][r(0,3)];const z=numZh(n);hz=z.hz;py=z.py;vn=String(n);if(kind===1){hz+='块钱';py+=' kuài qián';vn=n+' tệ'}}
 return{id:'gen'+Math.random().toString(36).slice(2),gen:1,t:'cau',hsk:1,topic:'Số',hz,py,vn,hv:'',tn:py.split(' ').map(parsePinyinTone)}}
const POLY='觉长得了还行便为好少空都重乐教着地的和大会要看种只发间数相当处难给转量调不一';
function tonePool(){const m={};for(const it of allItems())for(const u of units(it)){const ch=hanOnly(u.hz),sy=(u.py||'').split(' ');ch.forEach((c,i)=>{const t=(u.tn||[])[i];if(!t||POLY.includes(c)||!sy[i])return;(m[c]=m[c]||{c,py:sy[i].toLowerCase(),t,set:new Set()}).set.add(t)})}return Object.values(m).filter(x=>x.set.size===1)}
function startSess(k){if(k==='ear'){const p=sh(tonePool()).slice(0,12);startL('Luyện tai thanh điệu',p.map(ch=>({type:'ear',it:ch})))}
 else if(k==='num'){const q=[];for(let i=0;i<10;i++){const kind=i%3,it=genNum(kind);const o=[it];let g=0;while(o.length<4&&g++<40){const x=genNum(kind);if(!o.some(y=>y.vn===x.vn))o.push(x)}q.push({type:'listenVN',it,opts:sh(o)})}if(!micBlocked)for(let i=0;i<2;i++)q.push(mkEx('speak',genNum(i)));startL('Số · giá tiền · giờ',q)}
 else if(k==='weak'){const its=allItems().filter(x=>x.t!=='doan'&&S.prog[x.id]&&S.prog[x.id].best<80).slice(0,8);if(!its.length){toast('Chưa có câu yếu nào — bạn đang làm rất tốt! 🎉');return}startL('Luyện điểm yếu',buildQueue(its,false,'review'))}
 else if(k==='mix'){const ids=allNodes().filter(n=>n.kind==='lesson'&&(N()[n.id]||0)>0).flatMap(n=>n.ids);const its=sh([...new Set(ids)]).slice(0,8).map(byId).filter(Boolean);if(its.length<3){toast('Học xong ít nhất 1 bài để mở ôn tập trộn.');return}startL('Ôn tập trộn',buildQueue(its,false,'review'))}}

 let ms=CHAT.slice(-8).map(m=>({role:m.r==='user'?'user':'assistant',content:m.r==='user'?m.t:JSON.stringify(m.j)}));while(ms.length&&ms[0].role!=='user')ms.shift();ms[0]={role:'user',content:sys+'\n\nNgười học: '+ms[0].content};
 try{const res=await SAMPLE(ms,{cache:false,modelTier:'quick'});const m=String(res&&res.text||'').match(/\{[\s\S]*\}/);const j=JSON.parse(m?m[0]:'{}');if(!j.hz)throw new Error('empty');CHAT.push({r:'ai',j});speak(j.hz,S.rate)}catch(e){CHAT.push({r:'err',t:e&&e.code==='rate_limited'?'Đang quá tải, thử lại sau ít phút.':'AI chưa trả lời được. Thử lại nhé.'});if(e&&e.code==='not_granted')SAMPLE=null}

function vSay(){const it=G.words[G.si],res=P.result,live=!!REC;if(res&&!res.err&&!res._c){res._c=1;G.best=Math.max(G.best||0,res.overall);G.tries++}
 if(micBlocked)return`<div class="col" style="gap:14px"><div class="warn">Màn này cần micro để chấm giọng nói, mà micro đang bị chặn ở đây. Mở bản GitHub Pages trên điện thoại để chơi màn này. Bạn có thể bỏ qua để chơi tiếp.</div><button class="btn3 w" data-g="sayskip">Bỏ qua màn này</button></div>`;
 return`<div class="col" style="gap:12px"><div class="row between"><b>Từ ${G.si+1}/3</b><span class="small mute">Điểm tốt nhất: ${G.best||0}</span></div><div class="card col" style="padding:18px;gap:8px;align-items:center;text-align:center"><div class="ruby">${rubyHTML(it,res&&!res.err?res:null)}</div><div class="small mute">${esc(it.vn)}</div></div><div class="col" style="align-items:center;gap:10px"><div class="meter" id="meter">${live?Array.from({length:26},()=>'<i></i>').join(''):''}</div><div class="row" style="gap:28px"><button class="circ" style="width:56px;height:56px;background:var(--ink);color:#fff;border:0" data-act="say" data-text="${esc(it.hz)}">${ic('head',24)}</button><button class="rec ${live?'live':''}" data-g="grec" ${P.busy?'disabled':''}><span style="color:#fff">${ic(live?'stop':'mic',32)}</span></button><button class="circ" style="width:56px;height:56px;${P.url?'':'opacity:.3'}" data-act="playme">${ic('repeat',22)}</button></div><span class="small mute" style="font-weight:700">${P.busy?'Đang chấm…':live?'Đang nghe…':'Nói 2 lượt, lấy điểm cao nhất'}</span></div>${res&&res.err?`<div class="warn">${esc(res.err)}</div>`:''}${res&&!res.err?`<div class="row" style="gap:12px;align-items:center;justify-content:center">${ring(res.overall,58)}<b>${res.overall>=85?'Chuẩn lắm!':res.overall>=70?'Khá tốt!':'Cố thêm chút nhé'}</b></div>`:''}${(G.tries>=1&&res)||G.tries>=2?`<div class="row" style="gap:8px">${G.tries<2&&G.best<85?`<button class="btn3 w" style="flex:1" data-g="grec2">Nói lại</button>`:''}<button class="btn3 g" style="flex:1" data-g="saynext">${G.si>=2?'Hoàn thành':'Từ tiếp theo'}</button></div>`:''}</div>`}
/* -- khung chung + kết quả -- */
function vGame(){if(!G){view='games';return vGames()}const g=G.game;const nm=GAMES[g];const goal=G.free?'Chơi tự do · tích XP':'Mục tiêu: ≥70% qua màn · ≥90% ba sao';const body=g==='flip'?vFlip():g==='rain'?vRain():g==='wordle'?vWordle():g==='bingo'?vBingo():g==='tone'?vTone():(g==='race'||g==='boss')?vRace():g==='build'?vBuild():vSay();
 return`<div class="col fade" style="gap:14px;padding-bottom:24px"><div class="row" style="gap:12px"><button class="circ" style="width:38px;height:38px" data-g="gquit">${ic('x',18)}</button><div class="col" style="flex:1"><b>${nm[0]} ${nm[1]}</b><span class="tiny mute">${goal}</span></div></div>${body}</div>`}
function vGDone(){const r=GR||{acc:0,stars:0,xp:0,words:[],miss:[]};const msg=r.pass||r.free?(r.stars>=3?'Hoàn hảo!':r.stars>=2?'Rất tốt!':'Qua màn!'):'Chưa qua màn';const nextOK=!r.free&&r.pass;
 return`<div class="col fade" style="gap:16px;align-items:center;text-align:center;padding-top:20px"><span class="masc big">${r.pass||r.free?'🎉':'💪'}</span><div class="col" style="gap:6px"><h1>${msg}</h1><div>${r.free?'':starsHTML(r.stars,34)}</div><span class="mute">Độ chính xác ${Math.round(r.acc)}% · +${r.xp} XP</span></div>${r.arrivedNow?`<div class="card pop" style="padding:14px;width:100%;border:2px solid var(--gold)"><b>🛂 Dấu hộ chiếu mới!</b><div>Bạn đã đến <span class="hz">${r.arrivedNow.hz}</span> ${r.arrivedNow.vn} ${r.arrivedNow.em}</div></div>`:''}${r.added?`<div class="warn" style="width:100%;background:var(--goldS);color:#6F5410">🧠 ${r.added} từ chơi sai đã đưa vào <b>Bộ nhớ từ vựng</b> để ôn.</div>`:''}
 <div class="col" style="gap:8px;width:100%;text-align:left"><span class="sec">TỪ TRONG MÀN NÀY</span>${r.words.map(w=>{const inVm=!!vmAll()[w.id];return`<div class="item"><button class="col" style="flex:1;min-width:0;gap:1px;text-align:left" data-act="say" data-text="${esc(w.hz)}"><span class="row" style="gap:7px"><span class="hz" style="font-size:19px;font-weight:700">${esc(w.hz)}</span>${w.tag==='new'?'<span class="badge" style="background:var(--jade)">Mở rộng</span>':'<span class="badge" style="background:var(--gold)">Của bạn</span>'}${r.miss.includes(w.id)?'<span class="badge" style="background:var(--red)">Sai</span>':''}</span><span class="pyl">${pyInline(w.py,w.tn)}</span><span class="small mute">${esc(w.vn)}</span></button>${inVm?'<span class="small" style="color:var(--jade);font-weight:700">🧠 Đã có</span>':`<button class="pill" data-g="addvm" data-id="${esc(w.id)}">+ Bộ nhớ</button>`}</div>`}).join('')}</div>
 <div class="row" style="gap:8px;width:100%"><button class="btn3 w" style="flex:1" data-g="again">Chơi lại</button>${nextOK?`<button class="btn3 g" style="flex:1" data-g="gnext">Màn tiếp</button>`:''}</div><button class="link" data-g="games">Về bản đồ</button></div>`}
function gNextStage(){const r=GR;if(!r||r.free)return gGoMap();let a=r.di,b=r.si+1;if(b>=DEST[a].g.length){a++;b=0}if(a>=DEST.length)return gGoMap();if(!gUnlocked(a,b))return gGoMap();gStageClick(a,b)}
function gGoMap(){G=null;GR=null;stopAll();go('games')}
/* -- sự kiện v6 -- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-g]');if(!el)return;const a=el.dataset.g,d=el.dataset;try{AC().resume&&AC().resume()}catch(_){}
 switch(a){case'games':gGoMap();break;case'vocab':VSUM=null;go('vocab');break;case'vstart':vmStart();break;case'vpd':S.vmPerDay=+d.v;persist();render();break;case'vf':S.vmF=+d.v;persist();render();break;case'remask':remAsk();break;case'ics':icsDownload();break;case'remh':remCfg().hours=d.v.split(',').map(Number);persist();render();break;
 case'vsubmit':vmTypeSubmit();break;case'vhint':V6.hintUsed=true;vmHint();break;case'vreveal':V6.hintUsed=true;vmReveal();break;case'vrec':startRec();break;case'vspok':vmSpeakOK();break;case'vspretry':V6.sp++;P.result=null;render();break;case'vspfail':vmSpeakFail();break;case'vself':vmSelfSpoke();break;case'vnext':vmNext();break;case'vquit':if(V6&&V6.res.length)vmEnd();else{V6=null;stopAll();go('vocab')}break;
 case'free':gStart(d.k,Math.random()*DEST.length|0,0,true);break;case'stage':gStageClick(+d.d,+d.s);break;case'gquit':clearTimeout(G&&G.tm);rainRAF=0;gGoMap();break;case'again':if(GR){const r=GR;gStart(r.game,r.di,r.si,r.free)}break;case'gnext':gNextStage();break;case'addvm':vmAdd(d.id,'game');persist();render();toast('Đã thêm vào Bộ nhớ từ vựng');break;
 case'flipt':gFlipTap(+d.i);break;case'wguess':gWordleGuess(($('#gIn')||{}).value);break;case'wnext':gWordleNext();break;case'bing':gBingoTap(+d.i);break;case'tonep':gToneTap(+d.t);break;case'racep':gRacePick(+d.i);break;case'bchip':gBuildTap(+d.i);break;case'bundo':gBuildUndo();break;case'bretry':gBuildRetry();break;case'bnext':gBuildNext();break;
 case'grec':case'grec2':if(!REC&&G&&G.tries>=2)break;startRec();break;case'saynext':gSayDone();break;case'sayskip':gm().skip[G.sid||'x']=1;persist();gGoMap();toast('Đã bỏ qua màn cần micro.');break}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t&&t.id==='vIn'){e.preventDefault();vmTypeSubmit()}else if(t&&t.id==='gIn'&&G&&G.game==='wordle'){e.preventDefault();gWordleGuess(t.value)}});
const V6V={vocab:vVocab,vrev:vRev,vsum:vSum,games:vGames,game:vGame,gdone:vGDone};
(function(){const _t=vTabs;vTabs=function(){if(['lesson','done','scene','vrev','vsum','game','gdone'].includes(view))return'';const due=vmDueCount();const t=(v,icn,lab,badge)=>`<button class="tab ${view===v?'on':''}" data-act="go" data-v="${v}" style="position:relative">${ic(icn,23,view===v?2.2:1.8)}<span>${lab}</span>${badge?`<i style="position:absolute;top:-4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-style:normal;font-weight:800;padding:1px 5px">${badge}</i>`:''}</button>`;return t('home','home','Học')+t('games','dumb','Chơi')+t('vocab','book','Từ vựng',due||'')+`<button class="tab ${view==='ai'?'on':''}" data-act="go" data-v="ai"><span class="mic">${ic('chat',24)}</span><span style="color:${view==='ai'?'var(--red)':'var(--mute)'}">Nói AI</span></button>`+t('hub','mic','Luyện')+t('me','user','Tôi')}})();

(function(){const _r=render;render=function(){_r();try{if(view==='vrev'&&V6&&V6.stage==='type'){const x=document.getElementById('vIn');x&&x.focus()}else if(view==='game'&&G&&(G.game==='wordle')&&!G.done){const x=document.getElementById('gIn');x&&x.focus()}else if(view==='game'&&G&&G.game==='rain'){const x=document.getElementById('gIn');x&&x.focus()}}catch(e){}}})();
(function(){const _h=vHome;vHome=function(){const n=vmDueCount();const nl=Math.min(vmNewLeft(),vmNewList().length);const b=(n+nl)?`<button class="stage fade" data-act="go" data-v="vocab" style="border-color:var(--red)"><span class="ic" style="background:var(--redS)">🧠</span><span class="col" style="flex:1;gap:2px"><b>${n?n+' từ đến hạn ôn':nl+' từ mới chờ học'}</b><span class="small mute">Gõ + nói để giữ trí nhớ · chỉ 3 phút</span></span><span class="pill on">Ôn</span></button>`:'';return`<div class="col" style="gap:14px">${b}${_h()}</div>`}})();

const h=(location.hash||'').slice(1);if(['library','docs','hub','ai','me','games','vocab'].includes(h))view=h;
render();
</script>
