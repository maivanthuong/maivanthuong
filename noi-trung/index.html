<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nói Trung — Luyện nói tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F3EC;--ink:#17161B;--mute:#8C877F;--line:#E8E1D4;--card:#fff;--red:#D9442B;--redS:#FBE7E1;--jade:#12876A;--jadeS:#DDF1EA;--gold:#B8913A;--goldS:#F5ECD6;--t1:#E5484D;--t2:#F59F00;--t3:#2F9E44;--t4:#1C7ED6;--t0:#8C877F;--redG:linear-gradient(180deg,#EF6A47,#C9341D)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E9E2D6;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding:18px 18px 112px}
.hz{font-family:'Noto Serif SC','Songti SC','STSong',serif}
.hv{font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--gold)}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 30px -10px rgba(40,25,10,.16)}
.outline{background:#fff;border:1px solid var(--line);border-radius:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--redG);color:#fff;box-shadow:0 10px 20px -8px rgba(217,68,43,.55)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.icon{width:20px;height:20px;flex:none}
.circ{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);flex:none}
h1{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:0}
h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.small{font-size:12px}.tiny{font-size:11px}
.seg{display:flex;background:#EDE6DA;border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 0;border-radius:12px;font-size:13px;font-weight:600;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 4px 12px -4px rgba(0,0,0,.12)}
.badge{font-size:10px;font-weight:700;color:#fff;background:#D7CEBF;border-radius:999px;padding:1px 6px}
.seg button.on .badge{background:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:none;cursor:pointer;font-weight:600;padding:7px 13px;font-size:12px}
/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mute)}
.tab.on{color:var(--red);font-weight:700}
.tab .mic{width:52px;height:52px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -6px rgba(0,0,0,.4);margin-top:-18px}
.tab.on .mic{background:var(--redG);box-shadow:0 8px 16px -6px rgba(217,68,43,.6)}
/* home */
.hero{border-radius:28px;padding:20px;color:#fff;background:linear-gradient(135deg,#2A2630,#3B2125);position:relative;overflow:hidden;box-shadow:0 18px 32px -14px rgba(59,33,37,.6)}
.hero .wm{position:absolute;right:-18px;top:-46px;font-size:170px;opacity:.06;font-weight:700;pointer-events:none}
.bar{height:6px;border-radius:3px;background:#EAE3D6;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.stage{display:flex;align-items:center;gap:14px;padding:13px;border-radius:22px;background:#fff;border:1px solid var(--line);width:100%;text-align:left}
.stage .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:700;flex:none}
.tile{border-radius:22px;padding:14px;min-height:92px;text-align:left}
/* list */
.list{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .hzl{font-size:21px;font-weight:700;letter-spacing:.04em;line-height:1.25}
.pyl{font-size:12px;font-weight:600}
/* practice */
.ruby{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px}
.ch{display:flex;flex-direction:column;align-items:center;min-width:.9em;cursor:pointer;border-radius:10px;padding:2px 2px 4px;position:relative}
.ch i{font-style:normal;font-weight:600;line-height:1.3;white-space:nowrap}
.ch b{font-weight:700;line-height:1.15}
.ch.p{cursor:default}
.ch .sc{position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px}
.ch.cur{background:var(--redS)}
.hidepy .ch i{visibility:hidden}
.hidehz .ch b{color:transparent!important;background:repeating-linear-gradient(90deg,#EFE8DC 0 100%);border-radius:8px}
.note{display:flex;gap:10px;padding:11px 12px;border-radius:16px;background:var(--goldS);color:#6B5420;font-size:12.5px;line-height:1.45;text-align:left}
.rec{width:86px;height:86px;border-radius:50%;background:var(--redG);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(217,68,43,.10),0 0 0 24px rgba(217,68,43,.05),0 12px 22px -8px rgba(217,68,43,.6);transition:transform .15s}
.rec:active{transform:scale(.95)}
.rec.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,68,43,.35),0 12px 22px -8px rgba(217,68,43,.6)}100%{box-shadow:0 0 0 26px rgba(217,68,43,0),0 12px 22px -8px rgba(217,68,43,.6)}}
.meter{display:flex;align-items:center;gap:3px;height:34px;justify-content:center}
.meter i{width:3px;border-radius:2px;background:var(--red);height:4px;transition:height .08s}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:16px;width:100%;text-align:left}
.sent.cur{background:var(--redS);outline:1.5px solid rgba(217,68,43,.4)}
.sent .num{width:22px;height:22px;border-radius:50%;background:#EDE6DA;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:4px;color:var(--mute)}
.sent.done .num{background:var(--jadeS);color:var(--jade)}
.sent .hzs{font-size:19px;line-height:1.55;letter-spacing:.04em}
.sent.speaking .hzs{color:var(--red)}
.metric .bar{height:6px}
.ctile{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;border-radius:16px;background:#fff;border:1px solid var(--line);min-width:0}
.ctile.bad{background:var(--redS);border:1.5px solid var(--red)}
.ctiles{display:flex;gap:6px;flex-wrap:wrap}
.ctiles .ctile{flex:1 0 56px;max-width:80px}
canvas{width:100%;display:block}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:50;max-width:min(400px,90vw);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.sheet-bg{position:fixed;inset:0;background:rgba(23,22,27,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(440px,100%);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--mute)}
.field input,.field textarea,.field select{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;outline:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--red)}
.warn{background:var(--redS);color:#8E2A18;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.ok{background:var(--jadeS);color:#0C5E49;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lock{opacity:.6}
.spacer{height:14px}
</style>
</head>

function ring(score,size=40,label){const r=size/2-3.5,C=2*Math.PI*r,p=score==null?0:clamp(score,0,100)/100,col=scoreColor(score);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EFE9DE" stroke-width="5"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="Be Vietnam Pro" font-weight="800" font-size="${size*.3}" fill="${col}">${label??(score==null?'–':score)}</text></svg>`}

function parsePinyinTone(s){const marks={1:'āēīōūǖĀĒĪŌŪǕ',2:'áéíóúǘÁÉÍÓÚǗ',3:'ǎěǐǒǔǚǍĚǏǑǓǙ',4:'àèìòùǜÀÈÌÒÙǛ'};for(const k of [1,2,3,4])if([...s].some(c=>marks[k].includes(c)))return k;const m=s.match(/([1-5])$/);if(m)return m[1]==='5'?0:+m[1];return 0}

let dbRef=null,saveTimer=null,writing=Promise.resolve(),cloud='local';
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(!dbRef)return;const body=JSON.parse(JSON.stringify(S));writing=writing.then(()=>dbRef.set(body)).then(()=>{cloud='cloud'}).catch(e=>{if(e&&e.code==='invalid_argument'){dbRef=null;cloud='local'}})},900)}
(async()=>{try{if(!(window.claude&&claude.use))return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const uid=await user.id();if(!uid)return;const ref=db.doc('data/users/'+uid+'/state');const timer=new Promise(r=>setTimeout(()=>r(null),10000));const snap=await Promise.race([ref.get(),timer]);if(!snap)return;dbRef=ref;cloud='cloud';if(snap.exists){const d=snap.data();S=Object.assign({},S,JSON.parse(JSON.stringify(d)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}render()}else persist()}catch(e){}})();

/* ================== ĐƠN VỊ LUYỆN ================== */
function allItems(){return DATA.concat(S.custom||[])}
function units(item){if(item.t!=='doan')return[{...item,uid:item.id}];return item.parts.map((p,k)=>({...p,uid:item.id+'#'+k,t:'doan',hsk:item.hsk,topic:item.topic,parent:item.id,k}))}
function wholeUnit(item){return{uid:item.id+'#all',t:'doan',hsk:item.hsk,topic:item.topic,parent:item.id,k:'all',hz:item.parts.map(p=>p.hz).join(''),py:item.parts.map(p=>p.py).join(' '),tn:item.parts.flatMap(p=>p.tn),vn:item.parts.map(p=>p.vn).join(' ')}}
function best(item){if(item.t!=='doan'){const p=S.prog[item.id];return p?p.best:null}const bs=item.parts.map((_,k)=>S.prog[item.id+'#'+k]?.best).filter(v=>v!=null);const all=S.prog[item.id+'#all']?.best;if(all!=null&&bs.length<item.parts.length)return all;return bs.length?Math.round(bs.reduce((a,b)=>a+b,0)/item.parts.length):(all??null)}
function dueUnits(){const now=Date.now(),out=[];for(const it of allItems())for(const u of units(it)){const p=S.prog[u.uid];if(p&&p.due&&p.due<=now)out.push(u)}return out}
function record(uid,score){const p=S.prog[uid]||{best:0,n:0,reps:0};p.best=Math.max(p.best||0,score);p.last=score;p.n=(p.n||0)+1;if(score>=80){p.reps=Math.min((p.reps||0)+1,5);p.due=Date.now()+[1,3,7,14,30][p.reps-1]*DAY}else if(score>=60){p.due=Date.now()+DAY}else{p.reps=0;p.due=Date.now()+4*3600e3}S.prog[uid]=p;const d=today();if(!S.days.includes(d)){S.days.push(d);if(S.days.length>400)S.days=S.days.slice(-400)}persist()}
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(set.has(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function sandhiNotes(u){const ch=hanOnly(u.hz),tn=u.tn||[],out=[];for(let i=0;i<tn.length-1;i++)if(tn[i]===3&&tn[i+1]===3)out.push(`${ch[i]}${ch[i+1]}: hai thanh 3 liền nhau → ${ch[i]} đọc lên thành thanh 2.`);ch.forEach((c,i)=>{if(c==='不'&&tn[i]===2)out.push('不 đứng trước thanh 4 → đọc bú (thanh 2).');if(c==='一'&&(tn[i]===2||tn[i]===4))out.push(`一 biến điệu → đọc ${tn[i]===2?'yí (trước thanh 4)':'yì (trước thanh 1, 2, 3)'}.`)});return[...new Set(out)]}

let actx;function AC(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;actx=new C()}return actx}
function decode(blob){return blob.arrayBuffer().then(ab=>new Promise((res,rej)=>{const p=AC().decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)}))}
function mono(ab){const n=ab.length,ch=ab.numberOfChannels,out=new Float32Array(n);for(let c=0;c<ch;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)out[i]+=d[i]/ch}return out}
function down(x,sr){const f=Math.max(1,Math.round(sr/16000));if(f===1)return{x,sr};const n=Math.floor(x.length/f),y=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=0;j<f;j++)s+=x[i*f+j];y[i]=s/f}return{x:y,sr:sr/f}}
function pitchTrack(x,sr){const hop=Math.round(sr*.01),win=Math.round(sr*.035),minL=Math.floor(sr/450),maxL=Math.ceil(sr/70);const fr=[];let mx=0;
 for(let i=0;i+win+maxL<x.length;i+=hop){let e=0;for(let j=0;j<win;j++)e+=x[i+j]*x[i+j];const rms=Math.sqrt(e/win);mx=Math.max(mx,rms);fr.push({i,rms,f:0})}
 const thr=mx*.12,rs=new Float32Array(maxL+2);
 for(const F of fr){if(F.rms<thr)continue;const i=F.i;let bestR=0;rs.fill(0);for(let L=minL;L<=maxL;L++){let s=0,e1=0,e2=0;for(let j=0;j<win;j+=2){const a=x[i+j],b=x[i+j+L];s+=a*b;e1+=a*a;e2+=b*b}const r=s/Math.sqrt(e1*e2+1e-12);rs[L]=r;if(r>bestR)bestR=r}
  if(bestR<.55)continue;let L0=0;for(let L=minL+1;L<maxL;L++){if(rs[L]>=bestR*.9&&rs[L]>=rs[L-1]&&rs[L]>=rs[L+1]){L0=L;break}}if(!L0)continue;
  const a=rs[L0-1],b=rs[L0],c=rs[L0+1],den=a-2*b+c,off=den?clamp(.5*(a-c)/den,-.5,.5):0;F.f=sr/(L0+off)}
 const f=fr.map(F=>F.f);return f.map((v,k)=>{if(!v)return 0;const w=f.slice(Math.max(0,k-2),k+3).filter(Boolean).sort((a,b)=>a-b);return w[w.length>>1]})}
function tpl(t,final){return t===1?[5,5,5,5,5]:t===2?[3,3.4,3.9,4.4,5]:t===3?(final?[2,1.4,1,2,3.5]:[2,1.5,1.1,1,1.2]):t===4?[5,4.2,3.2,2.2,1]:[3,2.8,2.6,2.5,2.4]}
function effTones(tn){return tn.map((t,i)=>t===3&&tn[i+1]===3?2:t)}
function segment(f,N){let first=f.findIndex(v=>v>0),last=f.length-1-[...f].reverse().findIndex(v=>v>0);if(first<0)return null;
 const runs=[];let s=-1,gap=0;for(let k=first;k<=last+1;k++){const v=k<=last&&f[k]>0;if(v){if(s<0)s=k;gap=0}else if(s>=0){gap++;if(gap>=4||k>last){runs.push([s,k-gap]);s=-1;gap=0}}}
 const good=runs.filter(([a,b])=>b-a>=4);if(good.length===N)return good.map(([a,b])=>{const g=[];for(let k=a;k<=b;k++)if(f[k]>0)g.push(k);return g});
 const idx=[];for(let k=first;k<=last;k++)if(f[k]>0)idx.push(k);if(idx.length<N*3)return null;const out=[];for(let n=0;n<N;n++)out.push(idx.slice(Math.floor(n*idx.length/N),Math.floor((n+1)*idx.length/N)));return out}
function pct(arr,p){const a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.round(p*(a.length-1))))]}
function toneScore(f,tn){const N=tn.length;if(!N)return null;const groups=segment(f,N);if(!groups)return null;const eff=effTones(tn);const tpls=eff.map((t,i)=>tpl(t,i===N-1));

  const t=tpls[i],mu=u.reduce((a,b)=>a+b,0)/5,mt=t.reduce((a,b)=>a+b,0)/5;let dr=0,ds=0;for(let q=0;q<5;q++){dr+=Math.abs(u[q]-t[q]);ds+=Math.abs((u[q]-mu)-(t[q]-mt))}dr/=5;ds/=5;let sc=Math.round(clamp(100-(.4*dr+.6*ds)*34,20,100));if(eff[i]===0)sc=Math.max(sc,80);return{u,t,score:sc,eff:eff[i]}})}

async function analyze(blob,alts){P.busy=true;P.result=null;if(P.url)URL.revokeObjectURL(P.url);P.blob=blob;P.url=URL.createObjectURL(blob);render();
 try{const ab=await decode(blob);const {x,sr}=down(mono(ab),ab.sampleRate);const f=pitchTrack(x,sr);const u=P.u;const target=hanOnly(u.hz);const tn=(u.tn&&u.tn.length===target.length)?u.tn:null;
  const ts=tn?toneScore(f,tn):null;const rm=recogMatch(target,alts);
  if(!ts&&!rm){P.busy=false;P.result={err:'Chưa nghe rõ giọng. Hãy nói to, rõ, gần micro hơn và thử lại.'};render();return}

function drawContour(){const cv=$('#cv');if(!cv)return;const r=P.result,ts=r.ts,N=ts.length;const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=150;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);const top=10,bot=H-26,y=l=>bot-(l-1)/4*(bot-top);

 <div class="row between" style="margin-bottom:14px"><h2>${e.id?'Sửa câu':'Thêm câu của bạn'}</h2><button class="circ" data-act="close">${ic('x',18)}</button></div>
 <div class="field"><label>Chữ Hán *</label><input id="f_hz" class="hz" style="font-size:20px" placeholder="例如：这套房子很漂亮。" value="${esc(e.hz||'')}"></div>
 <div class="field"><label>Pinyin có dấu (cách nhau bằng dấu cách, mỗi chữ một âm)</label><input id="f_py" placeholder="zhè tào fáng zi hěn piào liang" value="${esc(e.py||'')}"><span class="tiny mute" id="f_chk"></span></div>
 <div class="field"><label>Nghĩa tiếng Việt</label><input id="f_vn" placeholder="Căn nhà này rất đẹp." value="${esc(e.vn||'')}"></div>
 <div class="field"><label>Âm Hán Việt (tuỳ chọn)</label><input id="f_hv" value="${esc(e.hv||'')}"></div>
 <div class="row" style="gap:10px"><div class="field" style="flex:1"><label>Tầng</label><select id="f_t"><option value="cum" ${e.t==='cum'?'selected':''}>词 Cụm từ</option><option value="cau" ${e.t!=='cum'?'selected':''}>句 Câu</option></select></div><div class="field" style="flex:1"><label>Cấp HSK</label><select id="f_hsk">${[1,2,3,4,5,6].map(n=>`<option ${(e.hsk||2)===n?'selected':''}>${n}</option>`).join('')}</select></div></div>
 <div class="field"><label>Chủ đề</label><input id="f_topic" placeholder="Bất động sản, Mua sắm…" value="${esc(e.topic||'')}"></div>
 <p class="tiny mute" style="margin:0 0 12px;line-height:1.5">Mẹo: để soạn đoạn văn, thêm từng câu ở tầng “Câu” cùng một chủ đề. Pinyin đúng số chữ thì app mới chấm được thanh điệu.</p>
 <div class="row" style="gap:10px">${e.id?`<button class="btn ghost" style="color:var(--red)" data-act="delcustom" data-id="${esc(e.id)}">${ic('trash',16)}</button>`:''}<button class="btn ghost" data-act="sayform">${ic('head',16)} Nghe thử</button><button class="btn primary" style="flex:1" data-act="savecustom">${ic('check',17)} Lưu vào kho</button></div>
 </div></div>`}
function vStats(){const st=streak();const tot=Object.values(S.prog).reduce((a,p)=>a+(p.n||0),0);const mastered=Object.values(S.prog).filter(p=>p.best>=80).length;const avg=(()=>{const v=Object.values(S.prog).map(p=>p.best);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null})();
 const days=[];for(let i=27;i>=0;i--){const d=new Date(Date.now()-i*DAY);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');days.push(S.days.includes(k))}
 return`<div class="sheet-bg" data-act="closebg"><div class="sheet fade" data-stop="1"><div class="row between" style="margin-bottom:14px"><h2>Tiến độ &amp; giọng đọc</h2><button class="circ" data-act="close">${ic('x',18)}</button></div>
 <div class="row" style="gap:8px">${[[st,'ngày liên tiếp','var(--gold)'],[tot,'lần luyện','var(--ink)'],[mastered,'câu ≥ 80đ','var(--jade)']].map(([v,l,c])=>`<div class="outline col" style="flex:1;align-items:center;padding:12px 0"><b style="font-size:22px;color:${c}">${v}</b><span class="tiny mute">${l}</span></div>`).join('')}</div>
 <p class="small mute" style="margin:16px 0 8px;font-weight:600">28 ngày gần đây</p><div style="display:grid;grid-template-columns:repeat(14,1fr);gap:5px">${days.map(d=>`<i style="aspect-ratio:1;border-radius:5px;background:${d?'var(--jade)':'#EAE3D6'}"></i>`).join('')}</div>
 <p class="small mute" style="margin:16px 0 4px">Điểm trung bình tốt nhất: <b style="color:${scoreColor(avg)}">${avg??'–'}</b></p>
 <p class="small mute" style="margin:18px 0 6px;font-weight:600">Giọng đọc tiếng Trung</p>${zhVoices().length?`<div class="field"><select id="voiceSel">${zhVoices().map(v=>`<option value="${esc(v.name)}" ${zhVoice()&&zhVoice().name===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div><button class="btn ghost" style="width:100%" data-act="testvoice">${ic('head',16)} Nghe thử giọng</button>`:`<div class="warn">Máy chưa có giọng tiếng Trung nên đọc không rõ. iPhone: Cài đặt › Trợ năng › Nội dung được đọc › Giọng nói › Tiếng Trung (Trung Quốc đại lục) › tải giọng có chữ “Nâng cao”. Máy Mac: Cài đặt hệ thống › Trợ năng › Nội dung được đọc › Giọng hệ thống › Quản lý giọng nói.</div>`}<p class="tiny mute" style="margin-top:8px;line-height:1.5">Mẹo cho giọng rõ nhất: tải giọng “Nâng cao/Premium”, rồi chọn ở đây.</p>
 <p class="tiny mute" style="line-height:1.5">${cloud==='cloud'?'Tiến độ được lưu vào tài khoản Claude của bạn.':'Tiến độ đang lưu trên trình duyệt này.'}</p></div></div>`}

/* ================== SỰ KIỆN ================== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.act==='closebg'&&e.target.closest('[data-stop]'))return;const a=el.dataset.act,d=el.dataset;
 switch(a){
 case'go':go(d.v);break;
 case'quick':{if(view==='practice')return;const s=suggest().u;openItem(s.parent||s.uid,s.parent?s.k:undefined);break}
 case'tier':F.tier=d.t;F.hsk=0;F.only='';go('library');break;
 case'tierf':F.tier=d.t;render();break;
 case'hsk':F.hsk=+d.v;render();break;
 case'only':F.only=d.v;render();break;
 case'open':openItem(d.id,d.k===''||d.k==null?undefined:(d.k==='all'?'all':+d.k));break;
 case'say':speak(d.text,S.rate);break;
 case'sayc':speak(d.text,.6);break;
 case'sayu':speak(P.u.hz,S.rate);break;
 case'sayslow':{const cs=hanOnly(P.u.hz);let i=0;const nx=()=>{if(i>=cs.length||view!=='practice')return;speak(cs[i],.55,()=>{i++;setTimeout(nx,320)})};nx();break}
 case'testvoice':speak('你好，我们一起练习说中文。',S.rate);break;
 case'sayall':{const it=P.item;let k=0;const nx=()=>{if(k>=it.parts.length||view!=='practice'){P.speaking=null;render();return}P.speaking=k;render();speak(it.parts[k].hz,S.rate,()=>{k++;setTimeout(nx,250)})};nx();break}
 case'rate':S.rate=+d.v;persist();render();break;
 case'hidepy':P.hidePy=!P.hidePy;render();break;
 case'hidehz':P.hideHz=!P.hideHz;render();break;
 case'save':S.saved[d.id]=!S.saved[d.id];if(!S.saved[d.id])delete S.saved[d.id];persist();render();toast(S.saved[d.id]?'Đã lưu vào Kho câu':'Đã bỏ lưu');break;
 case'back':if(P.hskk){go('hskk');break}go(P.item&&view==='practice'?'library':'home');break;
 case'rec':try{AC().resume&&AC().resume()}catch(_){}startRec();break;
 case'upload':try{AC().resume&&AC().resume()}catch(_){}$('#fileIn').click();break;
 case'playme':playMe();break;
 case'ab':speak(P.u.hz,S.rate,()=>setTimeout(playMe,350));break;
 case'retry':P.result=null;render();window.scrollTo({top:0,behavior:'smooth'});break;
 case'next':nextUnit();break;
 case'review':{const due=dueUnits();if(!due.length){toast('Chưa có câu nào đến hạn ôn. Luyện bài mới nhé!');return}const q=due.slice();const f=q.shift();P.queue=q;openItem(f.parent||f.uid,f.parent?f.k:undefined,q);break}
 case'add':SHEET={edit:{}};render();break;
 case'hskk':startHskk(+d.part);break;
 case'showq':P.showQ=!P.showQ;render();break;
 case'sayq':speak(P.q.hz,S.rate);break;
 case'stats':SHEET='stats';render();break;
 case'close':case'closebg':SHEET=null;render();break;
 case'sayform':{const v=$('#f_hz').value.trim();if(v)speak(v,S.rate);break}
 case'savecustom':saveCustom();break;
 case'delcustom':S.custom=(S.custom||[]).filter(x=>x.id!==d.id);persist();SHEET=null;render();toast('Đã xoá');break;
 }});
document.addEventListener('change',e=>{if(e.target.id==='voiceSel'){S.voice=e.target.value;persist();speak('你好，我们一起练习说中文。',S.rate)}});
document.addEventListener('input',e=>{if(e.target.id==='f_hz'||e.target.id==='f_py'){const n=hanOnly($('#f_hz').value).length,m=$('#f_py').value.trim().split(/\s+/).filter(Boolean).length;const el=$('#f_chk');if(el)el.textContent=n?(m===n?'✓ Khớp '+n+' chữ — chấm được thanh điệu':`${n} chữ Hán, ${m} âm pinyin${m?' — chưa khớp':''}`):''}});
let meAudio=null;function playMe(){if(!P.url)return;try{meAudio&&meAudio.pause();meAudio=new Audio(P.url);meAudio.play().catch(()=>toast('Không phát được bản ghi.'))}catch(e){}}
function saveCustom(){const hz=$('#f_hz').value.trim();if(!hanOnly(hz).length){toast('Hãy nhập ít nhất một chữ Hán.');return}const py=$('#f_py').value.trim().replace(/\s+/g,' ');const sy=py?py.split(' '):[];const tn=sy.map(parsePinyinTone);const e=SHEET.edit||{};const item={id:e.id||('u'+Date.now().toString(36)),custom:true,t:$('#f_t').value,hsk:+$('#f_hsk').value,topic:$('#f_topic').value.trim()||'Của tôi',hz,py,tn:sy.length===hanOnly(hz).length?tn:[],hv:$('#f_hv').value.trim(),vn:$('#f_vn').value.trim()};S.custom=(S.custom||[]).filter(x=>x.id!==item.id).concat(item);S.saved[item.id]=true;persist();SHEET=null;F.tier=item.t;F.hsk=0;F.only='';toast(item.tn.length?'Đã lưu — chấm được thanh điệu':'Đã lưu (thêm pinyin để chấm thanh điệu)');go('library')}
document.addEventListener('keydown',e=>{if(view==='practice'&&e.code==='Space'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!micBlocked){e.preventDefault();startRec()}});
window.addEventListener('resize',()=>{if(view==='practice'&&P.result&&P.result.ts)drawContour()});
const h=(location.hash||'').slice(1);if(['library','docs','hskk'].includes(h))view=h;
render();
</script>
</body>
</html>
